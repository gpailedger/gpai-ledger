general_notes: "The public summary for Nova 2 Lite can be found <a href=\"https://docs.aws.amazon.com/ai/responsible-ai/nova-2-lite/overview.html\" target=\"_blank\"> on AWS's AI Service Card</a>. The summary mostly matches the structure of the template, however does not include an explicitly-enumerated list of large publicly available datasets, and contains general descriptions of data which lack sufficient detail to match the standards encouraged by the template. We assessed the summary's score to be <span class=\"openness partial\">71.01%</span> with Grade <strong>C+</strong> for <strong><i>transparency</i></strong>, and <span class=\"openness partial\">61.34%</span> with Grade <strong>C+</strong> for <strong><i>usefulness</i></strong>."