general_notes: "The public summary for Ministral 3 3B can be found <a href=\"https://legal.mistral.ai/ai-governance/models/ministral-3-3b\" target=\"_blank\"> on the model's section in the AI governance hub on Mistral's site</a>. The summary is largely identical to the summaries for the other Ministral 3 models. It mostly adheres to the structure of the template, however provides descriptions which do not match the degrees of detail demanded by the template. Furthermore, no list of crawled domains or full list of large public datasets is given. We assessed the summary's score to be <span class=\"openness partial\">57.93%</span> with Grade <strong>C</strong> for <strong><i>transparency</i></strong>, and <span class=\"openness partial\">58.93%</span> with Grade <strong>C</strong> for <strong><i>usefulness</i></strong>."