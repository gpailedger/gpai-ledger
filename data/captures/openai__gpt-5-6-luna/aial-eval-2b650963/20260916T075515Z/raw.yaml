general_notes: "The public summary for GPT-5.6 Luna can be found <a href=\"https://cdn.openai.com/pdf/gpt-5-6-luna-eu-ai-act-public-summary-of-training-content.pdf\" target=\"_blank\"> on OpenAI's site</a>, linked on one of OpenAI's help pages. No equivalent summary seems to be available for GPT 5.6 Sol or GPT 5.6 Terra. The summary matches the structure of the template, with points being lost primarily due to providing high-level information where more detailed information is encouraged. We assessed the summary's score to be <span class=\"openness partial\">67.76%</span> with Grade <strong>C+</strong> for <strong><i>transparency</i></strong>, and <span class=\"openness closed\">47.52%</span> with Grade <strong>D+</strong> for <strong><i>usefulness</i></strong>."