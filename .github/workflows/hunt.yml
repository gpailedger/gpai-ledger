name: relocation-hunt

on:
  schedule:
    - cron: "30 6 * * 1"   # weekly, Monday 06:30 UTC (after the daily sweep)
  workflow_dispatch:

concurrency:
  group: ledger-sweep      # never overlap with the daily sweep's commits
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt -c crawler/constraints.txt

      - name: Tier-0 discovery (HF org releases feed)
        run: python crawler/org_watch.py

      - name: Tier-1 probe (missing models against their provider's own URL patterns)
        run: python crawler/probe_missing.py

      # The approval queue is retired (31 Aug 2026). AIAL's evaluation metadata
      # names the document URL for every model they list — including the five
      # they have listed but not yet graded — so the judgement the queue existed
      # to collect is already answered upstream, and a model they do not list
      # contributes no scored reference point to FilingBench anyway.
      #
      # Discovery itself keeps running below and writes reports/hunt-latest.md.
      # It asks nobody anything. It stays because AIAL is one small academic
      # project with one repository, and if it stops, a ledger that only mirrors
      # it would freeze; the leads are then already there.
      - name: Queue candidates from the weekly Tier-3 report, if one has landed
        id: ingest
        continue-on-error: true      # never lose the week's discovery to a bad report
        run: python crawler/decisions.py ingest

      - name: Tier-2 relocation hunt (bounded site crawl, fingerprint-confirmed)
        run: python crawler/site_hunt.py

      - name: Commit hunt results
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gpai-ledger-hunt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          # discovered.json exists only once the probe has promoted something,
          # and `git add` is fatal on a missing pathspec
          for f in crawler/relocations.json crawler/discovered.json \
                   reports/unattributed-leads.json crawler/decisions.json \
                   reports/hunt-latest.md reports/org-watch-latest.md \
                   reports/probe-missing-latest.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no hunt changes"
          else
            git commit -m "hunt: $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for _ in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git pull --rebase origin main || exit 1
            done
            [ "$pushed" = 1 ] || { echo "push failed after 3 attempts"; exit 1; }
          fi
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Fail the run if a lead could not be recorded
        if: always() && steps.ingest.outcome != 'success'
        run: |
          echo "the weekly report could not be read into reports/unattributed-leads.json"
          echo "— discovery ran, but what it declined to attribute was not written down"
          exit 1
