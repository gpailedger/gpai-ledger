name: ledger-sweep

on:
  schedule:
    - cron: "47 5 * * *"   # daily 05:47 UTC — off-peak, polite to origin servers
  workflow_dispatch:

concurrency:
  group: ledger-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      site_ok: ${{ steps.pagesartifact.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the sweep runs third-party-influenced code paths (rendered pages,
          # mined URLs); never leave a writable token in the git config
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt -c crawler/constraints.txt pytest==9.1.1

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crawler/requirements.txt') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Unit tests (pure logic, no network)
        run: python -m pytest tests/ -q

      - name: Refresh registry from AIAL metadata (attributed)
        id: registry
        continue-on-error: true   # falls back to the committed sources.json
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/AIAccountabilityLab/gpai-training-transparency.git /tmp/aial-repo
          git -C /tmp/aial-repo sparse-checkout set evals
          python crawler/build_registry.py /tmp/aial-repo
          # timestamp-only churn must not commit on quiet days
          if [ "$(git diff crawler/sources.json | grep -E '^[+-] ' | grep -cvE 'generated_utc|aial_head')" -eq 0 ]; then
            git checkout -- crawler/sources.json
          fi

      - name: Capture sweep (Wayback + OpenTimestamps per new version)
        id: capture
        continue-on-error: true
        run: python crawler/run_capture.py

      - name: Meta hub extractor (EU AI Act series via rotating CDN URLs)
        id: metahub
        continue-on-error: true
        run: python crawler/meta_hub.py

      - name: Derived targets (URLs re-mined from watched pages each run)
        id: derived
        continue-on-error: true
        run: python crawler/derived_targets.py

      - name: Retry failed Wayback saves
        id: waybackretry
        continue-on-error: true
        run: python crawler/retry_wayback.py

      - name: Upgrade OpenTimestamps proofs to bitcoin anchors
        id: otsupgrade
        continue-on-error: true
        run: python crawler/upgrade_ots.py

      - name: Drift analysis
        id: drift
        continue-on-error: true
        run: python crawler/analyze_drift.py

      - name: Verify corpus integrity
        id: verify
        continue-on-error: true
        run: python crawler/verify_corpus.py

      # Evidence is committed even when a later step failed: captures already on disk
      # must never be lost to a tooling error.
      - name: Commit corpus changes
        id: commit
        if: success() || failure()
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gpai-ledger-sweep"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A data crawler/sources.json crawler/relocations.json reports
          if git diff --cached --quiet; then
            echo "no corpus changes this sweep"
          else
            git commit -m "sweep: $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git pull --rebase origin main || { git remote set-url origin "https://github.com/${{ github.repository }}.git"; exit 1; }
            done
            [ "$pushed" = 1 ] || { echo "push failed after 3 attempts"; git remote set-url origin "https://github.com/${{ github.repository }}.git"; exit 1; }
          fi
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      # If the push failed — or the commit step never ran because the job was
      # cancelled or timed out — the day's captures + OTS proofs exist ONLY on
      # this ephemeral runner: parachute them out as a git bundle before it
      # vanishes (always() steps still run during cancellation).
      - name: Preserve unpushed evidence as an artifact
        if: always() && steps.commit.outcome != 'success'
        run: |
          git rebase --abort 2>/dev/null || true
          git add -A data crawler/sources.json crawler/relocations.json reports
          git -c user.name=gpai-ledger-sweep -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "unpushed evidence (parachute)" || true
          git bundle create "$RUNNER_TEMP/unpushed-evidence.bundle" origin/main..HEAD \
            || git bundle create "$RUNNER_TEMP/unpushed-evidence.bundle" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.commit.outcome != 'success'
        with:
          name: unpushed-evidence
          path: ${{ runner.temp }}/unpushed-evidence.bundle
          retention-days: 30
          if-no-files-found: error

      - name: Build site
        id: sitebuild
        if: success() || failure()
        env:
          # repo Variables (Settings -> Secrets and variables -> Actions -> Variables)
          # flip the site to the custom domain without a commit:
          #   GPAI_SITE_URL=https://www.gpailedger.com  GPAI_SITE_ROOT=/
          #   GPAI_CUSTOM_DOMAIN=www.gpailedger.com     GPAI_CONTACT_EMAIL=contact@...
          GPAI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GPAI_SITE_ROOT: ${{ vars.GPAI_SITE_ROOT || format('/{0}/', github.event.repository.name) }}
          GPAI_SITE_URL: ${{ vars.GPAI_SITE_URL || '' }}
          GPAI_CUSTOM_DOMAIN: ${{ vars.GPAI_CUSTOM_DOMAIN || '' }}
          GPAI_CONTACT_EMAIL: ${{ vars.GPAI_CONTACT_EMAIL || '' }}
        run: python site/build.py

      - name: Reader-lens site lint
        id: sitelint
        if: success() || failure()
        env:
          # must mirror the Build site step's env: L1 resolves against the same
          # prefix, and L15 verifies the domain-mode SEO surface actually shipped
          GPAI_SITE_ROOT: ${{ vars.GPAI_SITE_ROOT || format('/{0}/', github.event.repository.name) }}
          GPAI_SITE_URL: ${{ vars.GPAI_SITE_URL || '' }}
          GPAI_CUSTOM_DOMAIN: ${{ vars.GPAI_CUSTOM_DOMAIN || '' }}
        run: python site/lint.py

      # deploy ONLY a fully-built, lint-clean site: a crashed build or failing lint
      # must never replace the last good published site with a partial dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
        if: always() && steps.sitebuild.outcome == 'success' && steps.sitelint.outcome == 'success' && steps.commit.outcome == 'success' && steps.verify.outcome == 'success'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: pagesartifact
        if: always() && steps.sitebuild.outcome == 'success' && steps.sitelint.outcome == 'success' && steps.commit.outcome == 'success' && steps.verify.outcome == 'success'
        with:
          path: site/dist

      # Surface capture-step failures AFTER evidence is safe: a red run means a step
      # broke, not that data was lost.
      - name: Fail the run if any capture step failed
        if: always()
        run: |
          if [ "${{ steps.registry.outcome }}" != "success" ] || \
             [ "${{ steps.capture.outcome }}" != "success" ] || \
             [ "${{ steps.metahub.outcome }}" != "success" ] || \
             [ "${{ steps.derived.outcome }}" != "success" ] || \
             [ "${{ steps.waybackretry.outcome }}" != "success" ] || \
             [ "${{ steps.otsupgrade.outcome }}" != "success" ] || \
             [ "${{ steps.drift.outcome }}" != "success" ] || \
             [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "a capture or verify step failed — corpus was committed, but investigate"
            exit 1
          fi

  deploy:
    needs: sweep
    # the artifact only exists when build+lint succeeded; deploy only then
    if: always() && needs.sweep.outputs.site_ok == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
