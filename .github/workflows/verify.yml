name: verify-only

# Independent integrity check, decoupled from capture noise: verifies the
# committed corpus, the site build, the workflows themselves, and code lint.
# Read-only — this workflow never writes to the repository.

on:
  schedule:
    - cron: "15 9 * * 3"   # weekly, Wednesday 09:15 UTC
  workflow_dispatch:

concurrency:
  group: verify-only
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt -c crawler/constraints.txt pytest==9.1.1 ruff==0.14.14

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Code lint (error-class rules only)
        run: ruff check --select E9,F63,F7,F82,F401,F811,F821 crawler site tests

      - name: Verify corpus integrity
        run: python crawler/verify_corpus.py

      - name: Site build + lint
        env:
          # repo Variables (Settings -> Secrets and variables -> Actions -> Variables)
          # flip the site to the custom domain without a commit:
          #   GPAI_SITE_URL=https://www.gpailedger.com  GPAI_SITE_ROOT=/
          #   GPAI_CUSTOM_DOMAIN=www.gpailedger.com     GPAI_CONTACT_EMAIL=contact@...
          GPAI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GPAI_SITE_ROOT: ${{ vars.GPAI_SITE_ROOT || format('/{0}/', github.event.repository.name) }}
          GPAI_SITE_URL: ${{ vars.GPAI_SITE_URL || '' }}
          GPAI_CUSTOM_DOMAIN: ${{ vars.GPAI_CUSTOM_DOMAIN || '' }}
          GPAI_CONTACT_EMAIL: ${{ vars.GPAI_CONTACT_EMAIL || '' }}
        run: |
          python site/build.py
          python site/lint.py

      - name: Workflow lint (actionlint, checksum-pinned)
        run: |
          curl -sSfLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Action pins are commit SHAs
        run: |
          bad=$(grep -RhoE "uses: [^@]+@[^ ]+" .github/workflows/ | grep -vE "@[0-9a-f]{40}( |$)" || true)
          if [ -n "$bad" ]; then
            echo "tag-pinned actions found (must be 40-hex commit SHAs):"
            echo "$bad"
            exit 1
          fi
